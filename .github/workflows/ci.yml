name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Lint
        run: python -m ruff check app/web/server.py app/self_improvement/code_editor.py app/self_improvement/nexus_mind.py app/self_improvement/web_runtime.py app/core/command_router.py app/settings_manager.py app/voice/feedback_loop.py tests/test_code_editor.py tests/test_main.py tests/test_router.py tests/test_web_api.py tests/test_web_runtime.py main.py

      - name: Compile
        run: python -m compileall app tests main.py theme.py
